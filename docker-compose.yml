name: vet-manage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vet_manage}
      POSTGRES_USER: ${POSTGRES_USER:-vetmanage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetmanage_dev_password}
    command: ['postgres', '-p', '55432']
    ports:
      - '${POSTGRES_PORT:-55432}:55432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 55432']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--port', '56379', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-56379}:56379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '56379', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vetmanage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vetmanage_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - '${RABBITMQ_AMQP_PORT:-55672}:55672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15673}:15673'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./vet-manage-api
      dockerfile: Dockerfile
      target: build
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3080
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-vetmanage}:${POSTGRES_PASSWORD:-vetmanage_dev_password}@postgres:55432/${POSTGRES_DB:-vet_manage}?schema=public
      REDIS_URL: redis://redis:56379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vetmanage}:${RABBITMQ_PASSWORD:-vetmanage_dev_password}@rabbitmq:55672
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      TSC_WATCHFILE: DynamicPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_NONPOLLING_WATCHER: 'false'
    command: ['sh', '-c', 'npx prisma generate && npm run start:dev']
    volumes:
      - ./vet-manage-api:/app
      - api_node_modules:/app/node_modules
      - api_generated:/app/src/generated
    ports:
      - '${API_PORT:-3080}:3080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./vet-manage-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3080/api/v1}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5174']
    volumes:
      - ./vet-manage-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '${FRONTEND_PORT:-5174}:5174'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  api_node_modules:
  api_generated:
  frontend_node_modules:
